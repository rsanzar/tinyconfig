apps:
  tiny-kernel:
    ci:
      jobs:
        - name: build-tiny-kernel
          runtime: kernel-builder-latest
          tshirt: large
          commands:
            # 1. Download official Linux 6.6 LTS source
            - wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
            - tar -xf linux-6.6.tar.xz
            
            # 2. Download Firecracker's official MicroVM CI config
            - wget https://raw.githubusercontent.com/firecracker-microvm/firecracker/main/resources/guest_configs/microvm-kernel-ci-x86_64-6.1.config -O firecracker.config
            
            - |
              cd linux-6.6
              
              # Apply the official Firecracker config instead of tinyconfig
              cp ../firecracker.config .config
              
              # CRITICAL Mainline Fix: Firecracker's config expects an Amazon Linux source tree.
              # Mainline Linux 6.6 requires PCI enabled for VirtIO block routing to work on Firecracker.
              ./scripts/config -e PCI -e VIRTIO_PCI
              
              # Ensure UDS / VSOCK is fully enabled for anzar-init to talk to Shiroe
              ./scripts/config -e NET -e INET -e UNIX -e VSOCKETS -e VIRTIO_VSOCKETS
              
              # Force-disable debug metadata to ensure the final binary stays under 5MB
              ./scripts/config -d DEBUG_INFO -d DEBUG_INFO_BTF -e DEBUG_INFO_NONE
              
              # Automatically adapt the 6.1 Firecracker config to the 6.6 source tree safely
              make ARCH=x86_64 olddefconfig
              
              # Compile the uncompressed ELF binary
              make ARCH=x86_64 vmlinux -j$(nproc)
              
              # Strip all remaining metadata
              strip --strip-all vmlinux || true
              
              # Expose for CD
              mkdir -p /app/public
              cp vmlinux /app/public/vmlinux

    cd:
      runtime: nginx-latest
      tshirt: standard
      type: warm
      start_commands:
        # 1. Configure nginx to serve the /app/public directory with directory listing enabled
        - echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/http.d/default.conf || echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/conf.d/default.conf
        
        # 2. Start Nginx
        - nginx -g "daemon off;"
      port: 80
      connection_limit: 1000
