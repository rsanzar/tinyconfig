apps:
  tiny-kernel:
    ci:
      jobs:
        - name: build-tiny-kernel
          runtime: kernel-builder-latest
          tshirt: large
          commands:
            - wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
            - tar -xf linux-6.6.tar.xz
            - |
              cd linux-6.6
              make ARCH=x86_64 tinyconfig
              
              # Use the kernel's config script to safely enforce flags without silent drops
              
              # 1. Force 64-bit architecture
              ./scripts/config -e 64BIT
              
              # 2. Fix the 8MB Size Bloat (Force-disable all debug symbols & BTF metadata)
              ./scripts/config -d DEBUG_INFO -d DEBUG_INFO_BTF -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5
              ./scripts/config -e DEBUG_INFO_NONE
              
              # 3. Core Firecracker
              ./scripts/config -e BINFMT_ELF -e BINFMT_SCRIPT -e KVM_GUEST -e MISC_DEVICES
              
              # 4. VirtIO (Disks, Networking, VSOCK)
              ./scripts/config -e VIRTIO_MMIO -e VIRTIO_MMIO_CMDLINE_DEVICES -e VIRTIO_PCI -e PCI
              ./scripts/config -e VIRTIO_BLK -e EXT4_FS
              ./scripts/config -e NET -e INET -e UNIX -e VSOCKETS -e VIRTIO_VSOCKETS
              
              # 5. CRITICAL for Rust/Tokio Init Binary (anzar-init panics without these!)
              ./scripts/config -e EPOLL -e EVENTFD -e TIMERFD -e SIGNALFD -e FUTEX -e ANON_INODES
              
              # 6. CRITICAL for Init Mounts (/proc, /sys, /tmp, /dev, /dev/pts)
              ./scripts/config -e PROC_FS -e SYSFS -e DEVTMPFS -e DEVTMPFS_MOUNT
              ./scripts/config -e TMPFS -e SHMEM -e DEVPTS_FS -e UNIX98_PTYS
              
              # 7. Console for debugging
              ./scripts/config -e SERIAL_8250 -e SERIAL_8250_CONSOLE
              
              # Resolve dependencies based on the above selections
              make ARCH=x86_64 olddefconfig
              
              # Compile the uncompressed ELF binary
              make ARCH=x86_64 vmlinux -j$(nproc)
              
              # Final strip pass using the native toolchain
              strip --strip-all vmlinux || true
              
              mkdir -p /app/public
              cp vmlinux /app/public/vmlinux

    cd:
      runtime: nginx-latest
      tshirt: standard
      type: warm
      start_commands:
        # 1. Configure nginx to serve the /app/public directory with directory listing enabled
        - echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/http.d/default.conf || echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/conf.d/default.conf
        
        # 2. Start Nginx
        - nginx -g "daemon off;"
      port: 80
      connection_limit: 1000
