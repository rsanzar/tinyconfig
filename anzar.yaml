apps:
  tiny-kernel:
    ci:
      jobs:
        - name: build-tiny-kernel
          runtime: kernel-builder-latest
          tshirt: large
          commands:
            - wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
            - tar -xf linux-6.6.tar.xz
            
            - |
              cd linux-6.6
              make ARCH=x86_64 tinyconfig
              
              # Prevent 9.5MB debug symbol bloat at compile time
              echo "CONFIG_DEBUG_INFO_NONE=y" >> .config
              
              # Architecture & Core
              echo "CONFIG_64BIT=y" >> .config
              echo "CONFIG_BINFMT_ELF=y" >> .config
              echo "CONFIG_BINFMT_SCRIPT=y" >> .config
              echo "CONFIG_KVM_GUEST=y" >> .config
              
              # VirtIO Devices
              echo "CONFIG_VIRTIO_MMIO=y" >> .config
              echo "CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y" >> .config
              echo "CONFIG_VIRTIO_BLK=y" >> .config
              echo "CONFIG_EXT4_FS=y" >> .config
              
              # Console
              echo "CONFIG_SERIAL_8250=y" >> .config
              echo "CONFIG_SERIAL_8250_CONSOLE=y" >> .config
              
              # Networking & VSOCK
              echo "CONFIG_NET=y" >> .config
              echo "CONFIG_INET=y" >> .config
              echo "CONFIG_UNIX=y" >> .config
              echo "CONFIG_VSOCKETS=y" >> .config
              echo "CONFIG_VIRTIO_VSOCKETS=y" >> .config
              
              # CRITICAL: Allow the kernel to dynamically create /dev/vsock
              echo "CONFIG_DEVTMPFS=y" >> .config
              echo "CONFIG_DEVTMPFS_MOUNT=y" >> .config
              
              make ARCH=x86_64 olddefconfig
              make ARCH=x86_64 vmlinux -j$(nproc)
              
              # Force strip any remaining non-executable ELF sections using objcopy
              objcopy --strip-all vmlinux vmlinux-stripped
              
              mkdir -p /app/public
              cp vmlinux-stripped /app/public/vmlinux

    cd:
      runtime: nginx-latest
      tshirt: standard
      type: warm
      start_commands:
        # 1. Configure nginx to serve the /app/public directory with directory listing enabled
        - echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/http.d/default.conf || echo -e 'server {\n listen 80;\n location / {\n root /app/public;\n autoindex on;\n }\n }' > /etc/nginx/conf.d/default.conf
        
        # 2. Start Nginx
        - nginx -g "daemon off;"
      port: 80
      connection_limit: 1000
